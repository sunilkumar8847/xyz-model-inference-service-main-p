syntax = "proto3";

package xyz.inference.v1;

option java_package = "com.xyzfusion.inference.v1";
option java_outer_classname = "InferenceProto";

// gRPC service for real-time entity matching inference.
// Auth: caller must supply x-verified-tenant-id, x-verified-user-id in metadata.
service ModelInferenceService {
  // Single entity-pair match prediction.
  rpc Predict(PredictRequest) returns (PredictResponse);

  // Batch entity-pair predictions (parallel execution server-side).
  rpc PredictBatch(PredictBatchRequest) returns (PredictBatchResponse);

  // Return the Transformer embedding for a single entity.
  rpc GetEmbedding(GetEmbeddingRequest) returns (GetEmbeddingResponse);

  // SHAP explanation for a single prediction.
  rpc Explain(ExplainRequest) returns (ExplainResponse);
}

// ---------------------------------------------------------------------------
// Predict
// ---------------------------------------------------------------------------
message PredictRequest {
  string entity_id_1 = 1;
  string entity_id_2 = 2;
  // Optional pre-computed 50-dim feature vector; fetched from Feature Store if absent.
  repeated float features = 3;
  // Specific model version; empty string = champion.
  string model_version = 4;
  // Request-level timeout override (ms); 0 = service default (200 ms).
  int32 timeout_ms = 5;
  bool include_explanation = 6;
}

message PredictResponse {
  float match_probability = 1;
  string decision = 2;         // AUTO_MATCH | LIKELY_MATCH | UNCERTAIN | LIKELY_NON | AUTO_NON_MATCH
  string model_version = 3;
  int32 inference_ms = 4;
  float confidence_lower = 5;
  float confidence_upper = 6;
  bool fallback_used = 7;
  string fallback_reason = 8;
  ExplainResponse explanation = 9; // populated only when include_explanation=true
}

// ---------------------------------------------------------------------------
// PredictBatch
// ---------------------------------------------------------------------------
message PredictBatchRequest {
  repeated PredictRequest pairs = 1;
}

message PredictBatchResponse {
  repeated PredictResponse results = 1;
  int32 total = 2;
  int32 total_inference_ms = 3;
}

// ---------------------------------------------------------------------------
// GetEmbedding
// ---------------------------------------------------------------------------
message GetEmbeddingRequest {
  string entity_id = 1;
  // Optional pre-computed 50-dim feature vector; fetched from Feature Store if absent.
  repeated float features = 2;
  string model_version = 3;
}

message GetEmbeddingResponse {
  string entity_id = 1;
  // 128-dim Transformer embedding vector.
  repeated float embedding = 2;
  int32 dimension = 3;
  string model_version = 4;
  int32 inference_ms = 5;
}

// ---------------------------------------------------------------------------
// Explain
// ---------------------------------------------------------------------------
message ExplainRequest {
  string entity_id_1 = 1;
  string entity_id_2 = 2;
  repeated float features = 3;
  repeated string feature_names = 4;
  string model_version = 5;
}

message FieldContribution {
  string field_name = 1;
  float shap_value = 2;    // raw SHAP value
  float contribution_pct = 3; // percentage of total absolute attribution
}

message ExplainResponse {
  repeated FieldContribution contributions = 1;
  float match_probability = 2;
  string human_readable = 3;
  string model_version = 4;
}
