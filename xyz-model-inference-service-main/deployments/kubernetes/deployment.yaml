# deployments/kubernetes/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-inference-service
  labels:
    app: model-inference-service
    version: v3.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-inference-service
  template:
    metadata:
      labels:
        app: model-inference-service
        version: v3.0.0
    spec:
      containers:
      - name: model-inference-service
        image: xyzmdm/model-inference-service:3.0.0
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: SERVICE_PORT
          value: "8000"
        - name: LOG_LEVEL
          value: "INFO"
        
        # Triton configuration
        - name: TRITON_HOST
          value: "triton-inference-service"
        - name: TRITON_PORT
          value: "8001"
        - name: TRITON_GRPC_PORT
          value: "8001"
        - name: TRITON_TIMEOUT_MS
          value: "200"
        
        # Feature Store configuration
        - name: FEATURE_STORE_URL
          value: "http://feast-ui:8080"
        
        # MLflow configuration
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        
        # Redis configuration
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      
      volumes:
      - name: config
        configMap:
          name: model-inference-config
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - model-inference-service
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: model-inference-service
  labels:
    app: model-inference-service
spec:
  type: ClusterIP
  selector:
    app: model-inference-service
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-inference-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-inference-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-inference-config
data:
  config.yaml: |
    service:
      name: model-inference-service
      version: 3.0.0
      environment: production
    inference:
      timeout_ms: 200
      enable_shap: true
      fallback_enabled: true
    models:
      ab_test_enabled: false
      champion_version: v5
      refresh_interval_s: 300